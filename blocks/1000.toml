# The program segment, block by block, for blockcmp.py. The program compiles
# into the .EXE and emits no .TPU, so units.py cannot see it and this is what
# measures it instead.
#
# EVERY BOUNDARY IS A SYMBOL OUR OWN BUILD EMITTED, read from build/SILKY.MAP's
# Publics by Value, except the four string literals -- Turbo Pascal puts a
# literal immediately before the routine that uses it, so those are the gaps
# between one routine's end and the next one's start.

segment = 0x1000
length  = 4848
unit    = "SILKY.EXE"
strip_header = true
at      = 0x0000
rule    = "linked"

# FORGIVE DGROUP, BECAUSE OURS IS GENUINELY ELSEWHERE. This reconstruction
# declares a fraction of the original's variables, so every DGROUP reference
# differs by placement rather than by error. SETUP.md says to forgive nothing
# until something needs forgiving; this needs it, and it stops needing it when
# the data group converges. No segment_delta: nothing excuses a segment.
varbase = 0x0000


