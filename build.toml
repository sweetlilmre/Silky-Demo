# How SILKY is built. Read by build.py, which stages the sources under 8.3
# names, drives a real Turbo Pascal inside DOSBox-X and reads the log back.
#
# NO MACHINE PATHS. DOSBox-X, the drive C: image and each compiler's location
# are answered by kit.local.toml, which is not committed.

src      = "src"
build    = "build"
wipe_tpu = true
title    = "Silky build"
drive    = "D"
log      = "BUILD.LOG"
timeout  = 180
lint     = "kit/tools/pascal/paslint.py"

[compiler]
default = "tp6"

# TURBO PASCAL 6, and the image says so: `Portions Copyright (c) 1983,90
# Borland` at 11a6:0219. WHICH PATCH LEVEL IS NOT SETTLED -- TP600 (23 Oct
# 1990) and TP601 (11 Jun 1991) are both installed and both declared, so the
# question can be measured rather than argued.
[compiler.tp6]
dialect  = "tp6"
# THE SWITCH LINE IS MEASURED OFF THE ORIGINAL, not copied from a sibling.
#
# $G+ is REQUIRED. The image contains `6a 03` (PUSH imm8) at 112f:00b9 and
# `c1 e0 04` (SHL r/m,imm8) at 1000:0d3c. Neither instruction exists on an
# 8086; both are 80186 and later, so 286 code generation was on.
#
# $S+ is REQUIRED and it is the default anyway. EVERY framed routine in this
# image opens by loading AX with its locals size and far-calling 11a6:04df --
# 112f:0000 does `xor ax,ax` then the call, 113c:0000 does `mov ax,6` first.
# That call IS the stack check, so getting this wrong would put a seven-byte
# difference at the head of every routine we transcribe.
switches = "/$G+ /$S+ /GD /Q"

[compiler.tp61]
dialect  = "tp6"
switches = "/$G+ /$S+ /GD /Q"

[assembler]
flags = "/la /m2"

[order]
# DECLARED, not derived, because the link order decides the segment addresses
# and those are the thing being measured. A unit must precede whatever uses it.
mode = "declared"
list = [
  "MODEX.PAS",    # 112f  the Mode X unit -- PutPixel, SetModeX, SetPlane
  "PALETTE.PAS",  # 113c  SetPalette and the table its init clears
  "SILKY.PAS",    # 1000  the program
]

[stage]
encoding = "cp437"
# BARS.INC is not a compilation target -- it is {$I}-included by SILKY.PAS --
# so it never appears in [order].list and would not be staged without this.
# The compiler answered `Error 15: File not found (BARS.INC)` until it was.
alongside = ["src/BARS.INC"]

[names]

# WHERE A WATCHED RUN HAPPENS. Staging wipes build/, so an executable only
# survives there until the next build of anything -- and the trap build.py's
# own docstring names is that the run directory still holds the PREVIOUS one
# under the same name, so it launches, behaves like the old code, and the
# change looks as though it did nothing. run/ is gitignored: everything in it
# is copied from bin/ and build/.
[install]
to = "run"

# The compiler names its output after the source and offers no way to say
# otherwise, so the rename happens here. run/ holds ORIG.EXE beside OURS.EXE
# so the two can be watched one after the other without a rebuild in between.
[install.as]
SILKY = "OURS.EXE"
