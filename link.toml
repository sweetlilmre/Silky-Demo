# SILKY's LAYOUT: which segments the load image holds, and where the data
# group starts. Read by mapcmp, linkorder, linkbytes, dgroup, coverage and
# segdoc. One table per part; SILKY is one program, so it is a table with one
# row -- SETUP.md is explicit that a single-target project is not a special
# case with its own keys.
#
# WHERE THESE ADDRESSES CAME FROM. Originally the MZ relocation table -- 136
# fixups naming five distinct targets, 112f 113c 1144 11a6 1247, plus 1000 as
# the load base -- and the same six Ghidra derives its CODE_n blocks from,
# which is why those two agree: one measurement read twice, not two agreeing.
#
# THERE IS NOW A LINKER MAP as well, build/SILKY.MAP, and it confirms them
# independently: its segment table lists the same five, and its Publics by
# Value puts our routines at the ORIGINAL's offsets -- WAITRETRACE 0000,
# GOTOSCNPOS 000E, DELTAPAL 002B, DRAWIT 0052, ROTPAL2 015D, ROTPAL3 01FF,
# ROTPAL0 02A1. Crt is absent from it because nothing references Crt yet.
#
# The arithmetic does close twice over, and that part is independent. Every
# segment's extent is the next one's base, the chain ends at paragraph 1279,
# and (1279 - 1000) * 16 = 10128 bytes -- which is the load image size computed
# from the MZ header's own page count, by a different route.
#
# THE BLIND SPOT WAS A UNIT NO FIXUP NAMES -- a base only appears above if
# something refers to it across a segment boundary, so a unit never entered
# from outside its own segment would sit inside its neighbour's extent in
# silence. The map closes that for everything built so far and will keep
# closing it as more is transcribed.

layout = "docs/00-map.md"    # the segment/size document coverage measures
                             # against; segdoc.py generates one

[lists]
# The runtime's units -- NOT ours to transcribe.
#
# System is named by its own banner: 11a6 carries "Runtime error " and
# "Portions Copyright (c) 1983,90 Borland", which is the Turbo Pascal 6.0
# runtime, and survey.py finds it calling OUT to nothing at all -- everything
# depends on it and it depends on nobody, which is what a runtime looks like.
#
# Crt is named FROM OUR OWN BYTES. Six routines were read out of 1144 with
# substrate/disasm.py, and each is a Crt export doing what only Crt does:
#
#   0000  the unit init. Builds two records at DGROUP 0x5196 and 0x5296 --
#         exactly 0x100 apart, which is the size of a Turbo Pascal TextRec --
#         and hands each to a System routine. That is Input and Output being
#         assigned. It first calls 002e, which does `mov ah,0x0f` + int 10h,
#         takes mode 7 or anything <= 3 as it finds it and forces TextMode(3)
#         otherwise, then `mov ah,8` + int 10h to read the attribute at the
#         cursor and stores it, masked with 0x7f, as TextAttr.
#   0180  Window. Four BYTE parameters off ss:[bx+4..0xa], rejected if X1 > X2
#         or Y1 > Y2, decremented to 0-based so that 0 is invalid, bounds
#         checked against [0x5190]/[0x5191], stored to [0x518a] and [0x518c]
#         -- WindMin and WindMax -- then GotoXY(1,1). `retf 8` is four byte
#         parameters pushed as four words.
#   01c0  ClrScr. AX=0x600, BH from TextAttr at [0x5188], CX/DX the window
#         bounds, through the int 10h thunk.
#   02d4  Sound. `in 0x61` / `or al,3` / `out 0x61` gates the speaker, then
#         `mov al,0xb6` / `out 0x43` programs 8253 channel 2 for a square
#         wave, and the divisor goes out to 0x42 low byte then high. retf 2.
#   02f4  NoSound. `in 0x61` / `and al,0xfc` / `out 0x61`, no parameters.
#   0156  ReadKey, `mov ah,0` + int 16h -- and at 015c the Ctrl-Break path
#         writes '^' then 'C' to the console and issues int 23h.
#   0609  the int 10h thunk itself, preserving si, di, bp and es.
#
# CORROBORATION, and it is not the evidence. verdiff.py against the sibling
# consumer's Crt reports 1422 of 1568 bytes aligning, with every difference one
# constant DGROUP shift of +0x163e across 73 words plus three relocated segment
# bytes, and concludes the unit's source is unchanged. That comparison is what
# first suggested the name, and it was only available because another target on
# this machine happens to link the same unit -- which is luck, not method. The
# routines above are what a target with no sibling can still read.
rtl   = ["System", "Crt"]
noseg = []

[unitname]
# source name -> linker-map name, where they differ. EMPTY: nothing is
# abbreviated yet because nothing has been named yet. An entry here would be a
# decision about a map that does not exist.

[part."000"]
# THE MAP EXISTS. src/SILKY.PAS builds and /GD makes TPC emit it, so mapcmp
# reads this key rather than failing on it.
exe        = "SILKY.EXE"
map        = "build/SILKY.MAP"
main_unit  = "SILKY"         # THIS RECONSTRUCTION'S choice of name. The
                             # original's program name is not recoverable from
                             # the image; the linker map will say what we
                             # called it, which is not the same thing as what
                             # they called it.
# The program emits no .TPU, so units.py cannot see it; blockcmp measures it
# block by block instead, and this names the config. Written after two
# scratchpad scripts had already been built to do the same job by hand --
# SETUP.md's step 5 says plainly that this is what measures a program segment.
program_blocks = "blocks/1000.toml"
program_seg = 0x1000         # NAMED, never taken as segments[0]: position
                             # means "the program" only by coincidence of
                             # link order. Here it is evidenced -- the MZ
                             # header's CS:IP is 0000:119e, which lands at
                             # offset 0x119e inside this segment, and the
                             # instruction there calls 11a6:0000, the runtime's
                             # init. That is a program's entry, not a unit's.

# end_at AND dgroup_at ARE TWO FACTS, and here they are equal because the
# segment list below INCLUDES the runtime -- System is in it, so the walk and
# the data group meet at the same paragraph.
#
# BOTH ARE 1247, NOT 1279, and the difference is the whole reading of the tail.
# Ghidra draws a block it calls CODE_5 at 1247:0000..031f because four fixups
# name paragraph 1247, and those four are references TO the data group rather
# than code inside it. survey.py settles it: 800 bytes holding ZERO far returns
# and one printable string, which is the demo's entire scroll text -- "HAPPY
# BIRTHDAY SILKY ... A S P H Y X I A   R U L Z". Data, read as code by a
# disassembler that had only the fixups to go on.
end_at     = 0x1247
dgroup_at  = 0x1247

# ASCENDING AND COMPLETE, because each segment's extent is the NEXT entry's
# base -- which is why there is no length column. Two are named on evidence and
# two are not; the unnamed pair is open in the register, and a linker map is
# what will settle them.
segments = [
  { segment = 0x1000, name = "SILKY" },     # the program, 4848 bytes. Names
                                            # the four data files the demo
                                            # loads -- scroll.col, gold.Fnt,
                                            # Check2.Cel, Asphyx.Cel -- all
                                            # four of which are in bin/. No
                                            # framed far return in 4848 bytes,
                                            # which is right: a program body
                                            # ends in the runtime's halt.
  { segment = 0x112f, name = "MODEX" },     # 208 bytes, and the whole unit is
                                            # read. 0043 sets mode 13h then
                                            # UNCHAINS it -- Sequencer 04 with
                                            # bit 3 cleared turns chain-4 off,
                                            # GC 05 and GC 06 drop odd/even,
                                            # CRTC 14 and 17 give byte mode,
                                            # CRTC 13 takes the line width from
                                            # DGROUP 0x816. 00a0 is SetPlane,
                                            # 1 shl plane out to the Map Mask.
                                            # 0000 is PutPixel: x mod 4 picks
                                            # the plane, x div 4 the column.
                                            # README.1ST says this demo was
                                            # their first use of chain-4, and
                                            # this is that code. The NAME is
                                            # this reconstruction's.
  { segment = 0x113c, name = "PALETTE" },   # 128 bytes, and the whole unit is
                                            # read. 0045 is SetPalette: the
                                            # colour index out to 0x3c8 then
                                            # three components to 0x3c9, retf 8
                                            # for four byte parameters. 0067 is
                                            # the unit init and calls 0000,
                                            # which fills 67 records of 0x101
                                            # bytes from DGROUP 0x717, setting
                                            # each record's first word to
                                            # 0xffff and its byte at +0xfc to
                                            # zero. What that table IS remains
                                            # unread. The NAME is this
                                            # reconstruction's.
  { segment = 0x1144, name = "Crt" },       # 1568 bytes. The RTL's, see
                                            # [lists].rtl for the measurement.
  { segment = 0x11a6, name = "System" },    # 2576 bytes. The runtime; see
                                            # [lists].rtl.
]

# NOT A CODE SEGMENT -- see the note on dgroup_at above.
data = [ { segment = 0x1247, why = "the scroll text and DGROUP's initialised head, 800 bytes, and the last thing in the file" } ]
