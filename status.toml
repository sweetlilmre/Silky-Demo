[[plan.investigation]]
name = "markers-blocked-until-rtl-converges"
finding = "Eight of the eleven transcribed routines cannot carry an @asm marker yet. routines.py walks a routines bytes and stops at the first it cannot forgive, and for every FRAMED routine here that byte is the far call to the stack check at 11a6:04df: our System segment is at 0x00b80 and 1811 bytes long against the originals 2576, so the call target differs. All eight report SHORT at 6 or 7 bytes while being correct -- 2544 bytes across the run measure zero unexplained once relocation and DGROUP placement are accounted for, and that was checked against the MZ relocation table rather than against the same rule twice. They are held back rather than marked because a check list red for eight known-good routines is a check nobody reads, which is how a real regression hides. Marked: WaitRetrace, GotoScnPos and DeltaPal, all assembler with no stack check in the prologue, all three now LOCKED. This closes when the RTL converges, which is a consequence of transcribing more rather than a task of its own."
state = "open"

[[plan.investigation]]
name = "clampdown-entry-construct"
finding = "ClampDown at 09fb is transcribed and its BODY is right -- 156 bytes with zero unexplained once DGROUP addresses are accounted for -- but the two-byte entry construct is not. The original emits cmp byte [0x322],1 then jne to a trampoline that jmps near to the epilogue, with a short jmp over the trampoline to the body: seven bytes. `if Fading = 1 then begin ... end` emits the compact je over the near jmp: five. The near displacement e9 9a 00 is identical in both, so the body length already matches and only the branch form differs; the two-byte shift is what makes the whole routine read as 125 unexplained. A single-arm case was tried and is worse -- it loads through AL rather than comparing memory directly. TP600 and TP601 were both built and produce IDENTICAL output across the whole 2726-byte run, so the patch level is not the cause and that question is settled as indistinguishable on this corpus so far."
state = "open"

[[plan.investigation]]
name = "clampdown-guard-is-not-an-if"
finding = "PROBE RESULT, recorded because it is a negative one and negatives rot fastest. probes/GUARD.PAS puts ten constructs through the real compiler and none reproduces the seven-byte guard at 1000:09fb. The original is cmp byte [Fading],1 then jne +2 to a trampoline, jmp +3 over it into the body, and e9 near to the epilogue. Every variant emits the compact five instead -- one conditional straight over the near jmp. Tried: if/begin-end, if-not-then-Exit, if with an empty else, if with a goto, double negation, a bare Boolean, Boolean compared with True, an enumerated type, a subrange, and a body ending in Exit. All ten compact, under BOTH TP600 and TP601, which also produce byte-identical output for each other across the whole 2726-byte run. $B+ makes no difference either. So the extra `eb 03` comes from neither the shape of the if nor the type of the thing tested, and the next thing to suspect is the surrounding statement rather than the guard: something before it in the procedure that the prologue does not reveal, or a construct that wraps the whole body. The BODY is already right -- 156 bytes with zero unexplained -- so this is two bytes of entry sequence and nothing else. probes/guard.toml drives it."
state = "open"

[[plan.investigation]]
name = "loadfont-transcribed"
finding = "LoadFont at 1000:0aba is transcribed and measures 107 bytes with ZERO unexplained at its true position. It is New(Font); Assign(F,gold.Fnt); Reset(F,1); BlockRead(F,Font^,15104); Close(F). The allocator is identified rather than assumed: 11a6:023f takes one word, calls the heap routine at 0x308 and on carry loads AX with 203 and jumps to RunError -- 203 is heap overflow -- so it is the New helper, where the compiler passes SizeOf and assigns the returned pointer. GetMem would have passed the pointer as a var parameter instead. The frame is 0x184 = 388: the File sits at bp-0x80 so it is declared first, and 260 bytes follow that the routine never touches, the same shape as Drawits unused F. A String plus a LongInt makes 260 exactly, but only the TOTAL is recoverable from a frame size, not the composition, and the source says so. It reads as displaced in the run report only because ClampDown is still two bytes short."
state = "resolved"
resolution = "Zero unexplained at its true offset. Stays displaced in the aligned report until clampdown-guard-is-not-an-if is settled."

[[plan.investigation]]
name = "reinvented-blockcmp-twice"
finding = "A PROCESS FAILURE, recorded because it has now happened twice. The program segment was measured with two hand-written scratchpad scripts -- one comparing at fixed offsets, then a second that searched for each routines true position after a short routine displaced everything below it. blockcmp.py already does exactly that, better: it reports per-block shift, separates REAL differences from pending fixups, and prints a transcribed-bytes coverage figure the hand-rolled ones never had. It now reports 18 of 19 blocks agreeing and 3249 of 4848 bytes at 67 percent. The first instance was verdiff.py, which was found before anything was written. This one was not: SETUP.md step 5 states that a blocks config is what measures a program segment and its schema was read while setting this project up, so the information was in hand and went unused. The rule to apply next time is the one WORKING.md already gives -- an inline script long enough to be worth writing is long enough to be worth keeping, and the question to ask BEFORE writing it is which instrument already answers it."
state = "resolved"
resolution = "blocks/1000.toml is written with every routine and every string literal as a block, boundaries taken from our own build/SILKY.MAP Publics by Value. link.toml gains program_blocks pointing at it. The scratchpad scripts are not committed and are superseded."

[[plan.investigation]]
name = "showfont-transcribed"
finding = "ShowFont at 0cb1 is transcribed: 700 bytes, ZERO real differences. It renders every glyph into video memory once and then FREES the font -- 0f5b pushes the pointer and 0x3b00 to 11a6:0254, whose frame reads a size at bp+6 and a far pointer at bp+8, the Dispose helper matching the New at 023f. Each source row is drawn three screen rows tall; characters 32 to 79 go at y = Row*3 and then X resets and 80 to 90 go at y = Row*3+50, which is what the six identical PutPixel sites are. [bp-8] is set to 255 and never read -- the third declared-and-unused local in this program after Drawits F and RotPal2s loop2. The single real difference before the fix was X := X + 20 against the originals add word [bp-4],0x14, which is Inc(X,20)."
state = "resolved"
resolution = "Zero real differences at 700 bytes. blockcmp now reports 19 of 20 blocks agreeing and 3949 of 4848 bytes at 81 percent."

[[plan.investigation]]
name = "consult-the-wiki-before-hypothesising"
finding = "THIRD instance of rediscovering something the kit already holds, and this one is the sharpest. The Inc(X,20) finding is wiki/observations/inc-is-not-an-assignment, written 25 Aug 2026, and its description names the exact consequence that was hit: a reconstruction that picks the shorter one shifts every byte after it in the segment, and the coverage walk blames somewhere else. That is precisely what happened -- one wrong statement form at +0x151 displaced the rest of a 700-byte routine. The earlier two were verdiff.py, caught before anything was written, and blockcmp.py, not caught until two scratchpad scripts existed. The pattern is that the wiki index is consulted when a question is already framed as a general one, and not when it looks like a local puzzle about these particular bytes. The cheap habit is the opposite: grep wiki/index.md and the source-shape tag BEFORE hypothesising about codegen. Twelve observations carry that tag and several are exactly this kind of finding."
state = "open"
