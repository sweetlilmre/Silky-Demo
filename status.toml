[[plan.investigation]]
name = "transcribe-the-rest-of-barsinc"
finding = "Four BARS.INC routines are still untranscribed: Drawit at 0052, PlayPal at 064b, StartPal at 095e, and whatever fills the gap. Drawit and PlayPal are the two that will not compile as-is -- Drawit is missing the binarys scroll.col loading, and PlayPal references Value, Value2, Value3, Count, Count2, Count3 and PalCol which are declared outside the include. Bringing them in needs those globals declared and Drawits file section reconstructed from 1000:0052, where the literal scroll.col sits at 0047 and the System file group 04a9/0822/0850/093b is called. Doing so would carry the reconstruction from 002b to 09fb in one contiguous run, which is about half the program segment."
state = "resolved"
resolution = "Done for Drawit, PlayPal and StartPal. The contiguous run 1000:0000..09fb -- eleven routines, 2544 bytes -- now measures ZERO unexplained bytes, every difference being a relocation or a DGROUP address. Drawits missing file section is reconstructed from 1000:0052: Assign at 11a6:0822, Reset with a 768-byte record at 0850, BlockRead into T at 093b, Close at 08d1, each followed by the 04a9 that I+ emits; then a loop to 0x59 zeroing T[150+Loop] and calling SetPalette. Two type corrections came out of it: Value, Value2 and Value3 are SHORTINT not Integer -- one byte, and signed because PlayPal assigns -1 -- and Count, Count2, Count3 are Byte. They live at 0x324..0x326 and 0x31c..0x31e, which are exactly the addresses PlayPal reads. THE MEASUREMENT WAS CHECKED A SECOND WAY because the classifier had just been widened, which is how a forgiveness rule comes to explain everything: it makes 72 relocation calls in that range and the MZ relocation table holds exactly 72 relocations there. The remaining 419 differing bytes are DGROUP offsets, which are not relocated and so correctly absent from that table."

[[plan.investigation]]
name = "asm-lines-need-comments"
finding = "asmaudit reports 0 units meet the rule and 2 do not. WORKING.md section 6 requires hand-written assembler to be transcribed verbatim with a comment on EVERY line. The assembler I have written -- WaitRetrace and GotoScnPos in SILKY.PAS, SetModeX and SetPlanes asm block in MODEX.PAS, and the DeltaPal edit in BARS.INC -- carries block comments explaining what each routine does but not per-line commentary. The tool exits 0 so it is not gating, which is exactly why it went unnoticed for three commits. Roughly seventy lines need comments. Note BARS.INC is ORIGINAL source and its own assembler is the authors, not ours; only the lines this reconstruction wrote are covered by the rule."
state = "resolved"
resolution = "Done. Every hand-written assembler line in MODEX.PAS and SILKY.PAS now carries a comment, and each asm block has an EQUIVALENT PASCAL block above it labelled reference only, which is what asmaudit checks. It reports 2 units meet the rule, 0 do not. The rebuild is byte-for-byte unchanged -- MODEX still identical and the three program routines still zero unexplained -- so the comments cost nothing, which is the point of doing it at the moment the code is written. One trap on the way: the first EQUIVALENT PASCAL block used nested braces for its annotations and build.py refused with `nested { inside a { } comment -- TP7 does not nest, the comment ended early`. The lint caught it before the compiler did."

[[plan.investigation]]
name = "routines-locator-and-relocated-prologue"
finding = "routines.py locates a marked routine by searching the built image for the ORIGINALS opening bytes, and a relocated address inside those bytes defeats it. Measured here: PutPixel at 112f:0000 and SetPlane at 112f:00a0 were reported NOT FOUND in any built image while both were demonstrably present, at 0x923 and 0x9db. Both open with push bp, mov bp sp, xor ax ax, then a FAR CALL to the stack check whose four address bytes are relocated. SetModeX, whose prologue holds no fixup at all, was found and measured 93 bytes. WaitRetrace and GotoScnPos are assembler with no stack check and were found. This matters beyond these two: with $S+, which this target measurably uses, nearly every framed Turbo Pascal routine opens with that same far call, so most program routines will hit it as markers are added. --probe exists for the case and its candidates here were past the segment end, so it did not help. Markers were removed from MODEX.PAS because a unit is measured by units.py against its own TPU, which already reports it identical over all 202 bytes; the note in the file says so. Not yet raised as a kit change: verify the diagnosis on a second routine first."
state = "resolved"
resolution = "WITHDRAWN. Not a tool defect. Run against the two mature consumers, routines.py locates everything -- 20 of 20 in one and 91 of 91 in the other, the latter including 61 framed Pascal routines whose prologue holds the same stack-check far call. In a reconstruction whose link layout has converged the segments sit at the originals addresses, so that call is IDENTICAL rather than merely relocated, and the byte search succeeds. NOT FOUND here means our layout has not converged yet, which is information rather than a blind spot, and --probe already exists for the case. The proposed fix -- masking relocated words when matching a prologue -- would have weakened the locator for every consumer to serve an early-stage symptom. This is why the change was held for confirmation."

