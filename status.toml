[[plan.investigation]]
name = "smart-linker-drops-an-unreferenced-transcription"
finding = "A partial reconstruction must REFERENCE what it transcribes or it measures nothing. SILKY.PAS was first written with three transcribed assembler routines and an empty `begin end.` main. It compiled, it linked, and the built image contained NONE of them -- and none of ModeX either, so the whole unit vanished as well. The relocation table showed only two segment bases where the original has six. Nothing failed and nothing warned; the comparison would simply have had nothing to compare. Giving main a body that calls the three routines put all of them back at the right offsets. The main block sits at the end of the segment, so routine offsets from 0 are unaffected as it grows. The general shape: smart linking makes an unreferenced transcription invisible, and an absent routine reads exactly like a routine that was never written -- which is absence-reads-as-zero wearing a linker hat."
state = "resolved"
resolution = "Understood and worked around: main now calls the transcribed routines, with a [re] comment saying why it is not the original main block. Nothing to fix in the kit -- this is Turbo Pascal behaving correctly -- but it is a trap worth stating, because the failure is silent and looks like a transcription that did not land."

[[plan.investigation]]
name = "first-three-program-routines-identical"
