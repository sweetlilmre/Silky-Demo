[[plan.investigation]]
name = "palette-unit-at-25-percent"
finding = "PALETTE at 113c rebuilds to 25 percent, agreeing to +0x20 of 0x7c. One finding already banked: the unit is compiled with $G- where MODEX and the program use $G+. Measured -- at 113c:0018 the original computes the record offset with mov ax,$0101 then mul, which is 8086, and with $G+ Turbo Pascal emits imul di,[bp-2],$0101 instead, a 186 instruction. Adding $G- to the unit moved the agreement from 0x18 to 0x20. The next divergence is the address arithmetic: the original does mov di,ax then add di,$0717 and stores DI and DS directly, while ours does lea ax,[di+0] then goes through DX. Part of that is DGROUP placement -- our Tbl sits at offset 0 so the fold constant is 0 -- but the instruction FORM differs too, so the pointer expression is not yet the original one. The 257-byte record shape is also still a guess: only the word at +0 and the byte at +0xfc are evidenced."
state = "resolved"
resolution = "IDENTICAL, 124 of 124 bytes with 20 pending fixups. Four corrections, each found by rebuilding: (1) the unit is compiled $G- where MODEX and the program are $G+, measured at 113c:0018 where the original uses mov ax,$0101 then mul and $G+ emits imul di,[bp-2],$0101; (2) the record loop is a WITH, not an explicit pointer -- the original computes the address once into DI, adds the fold constant and stores DI:DS as a far pointer in a 4-byte local, then reaches each field through les di,[bp-6], which is what Turbo Pascal emits for with, and the 6-byte frame is the counter plus that hidden pointer; (3) ClearTable is FAR, ending in retf, with the init pushing CS before the near call; (4) the unidentified System call at 11a6:0815 is RANDOMIZE -- b4 2c cd 21 is DOS Get System Time storing CX and DX into DGROUP 0x316, which is RandSeed. Progress was 19, 25, 54, 91, identical."

