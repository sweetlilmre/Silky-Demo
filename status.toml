# Generated by kit/tools/pascal/{ratchet,observe,plan}.py. The lock is
# DATA, not code, so a lowering is a visible change here.
#
# `matched`, `achieved` and every [observation.*] are MEASURED. Never
# hand-edit them. To accept a regression, lower `target` with a `reason`.
# [plan] is DECIDED: investigation order is the priority order.

[coverage]
targets = 2

[routine."SILKY.DeltaPal"]
matched = 28

[routine."SILKY.GotoScnPos"]
matched = 29

[routine."SILKY.WaitRetrace"]
matched = 14

[[plan.investigation]]
name = "unidentified-units-112f-113c"
finding = "Two code segments have no name. 112f is 208 bytes, called from the program at nine sites through 112f:0000 and once through 112f:0043, and calls out only to System. 113c is 128 bytes, entered at 113c:0045 and 113c:0067, and holds the load images only virtual call site, a CALLF [DI+cb] at 113c:0079, so something in it is an object with a VMT. Both were located from the MZ relocation table rather than a linker map, so their extents are sound but their identities are unread. Crt at 1144 was settled by DISASSEMBLING IT: six routines that only Crt has, including Sound programming 8253 channel 2 through ports 0x43 and 0x42, Window storing WindMin and WindMax, and a ReadKey on int 16h. A comparison against a sibling binary suggested the name first, but that only worked because another target on this machine happens to link the same unit, which is luck and not a method. The cheapest next attempt for these two is the same disassembly: read what they touch. 113c is 128 bytes and holds the only VMT call site in the image, so its object declaration is the thing to recover first."
state = "resolved"
resolution = "Both read in full by disassembly, no sibling binary involved. 112f is the Mode X unit: 0043 sets mode 13h then unchains it (Sequencer 04 bit 3 cleared is chain-4 off, GC 05 and 06 drop odd/even, CRTC 14 and 17 give byte mode, CRTC 13 takes the line width from DGROUP 0x816), 00a0 is SetPlane writing 1 shl plane to the Map Mask, and 0000 is PutPixel using x mod 4 for the plane and x div 4 for the column. README.1ST says this demo was Asphyxias first use of chain-4, and this is that code. 113c is the palette unit: 0045 is SetPalette, colour index to port 0x3c8 then three components to 0x3c9, retf 8; 0067 is the unit init and calls 0000, which fills 67 records of 0x101 bytes from DGROUP 0x717, setting each first word to 0xffff and each byte at +0xfc to zero. Both names are this reconstructions choice, not recovered from the image. CORRECTION CARRIED OUT OF THIS: the claim that 113c:0079 held the images only virtual call site was FALSE. The bytes are e8 86 ff 5d cb, which is call rel16 then pop bp then retf, and the scanner matched across three instruction boundaries. There is no VMT in this image. survey.py prints that scan as an upper bound and it was recorded as a count. Left open in a new row: what the 67-record table at DGROUP 0x717 actually is."

[[plan.investigation]]
name = "no-linker-map-yet"
finding = "Every address in link.toml comes from the MZ relocation table, and the blind spot is a unit no fixup names: a segment base only appears there if something refers to it across a segment boundary, so a unit never entered from outside its own segment sits inside its neighbours extent with nothing reporting it. A linker map is what settles it. This closes when src/ holds a program that builds and build/SILKY.MAP exists, at which point link.toml segments and the map segment table can be compared."
state = "resolved"
resolution = "build/SILKY.MAP exists and mapcmp reads it. The blind spot it named -- a unit no fixup names, invisible to the relocation-table method -- is closed for what has been built: the maps segment table lists SILKY, PALETTE, MODEX, SYSTEM and DATA, matching the five the fixups gave, with Crt absent because nothing references it yet. The maps Publics by Value also confirms our routines land at the ORIGINALS offsets: WAITRETRACE 0000, GOTOSCNPOS 000E, DELTAPAL 002B, DRAWIT 0052, ROTPAL2 015D, ROTPAL3 01FF, ROTPAL0 02A1. mapcmp reports MODEX and PALETTE exact on length and SILKY short by 2240 bytes of routines nothing references yet."

[[plan.investigation]]
name = "table-at-dgroup-0717"
finding = "The palette unit at 113c fills 67 records of 0x101 bytes based at DGROUP 0x717, running to 0x4a5a. It writes only two fields per record: the first word gets 0xffff and the byte at +0xfc gets zero. Everything else in each 257-byte record is filled by something else, and nothing in 113c writes it. The counter runs 1 to 67 inclusive rather than from 0, so either record zero is skipped deliberately or the real base is 0x717 plus 0x101. Reading the program segment at 1000 for writers of this range is the next step; the demo loads gold.Fnt, Check2.Cel, Asphyx.Cel and scroll.col, and one of those is the likely filler."
state = "open"

[[plan.investigation]]
name = "barsinc-differs-from-binary"
finding = "bin/BARS.INC shipped with the demo and holds Procedure DeltaPal, whose every instruction corresponds to 1000:002b except one: the source writes rep outsb and the binary does lodsb, out dx al, loop. Equivalent in effect, different in bytes, so the include we hold is a VARIANT of the source this binary was built from and not that source. Which direction the edit went is unsettled; a rep outsb to the DAC was known to be too fast for some cards, so either is plausible. This matters beyond one routine: it sets how far BARS.INC can be trusted as ground truth for anything else it contains, and Drawit and PutPixel are also in it. The include did give up one original identifier for free -- lea si,t against lea si,[0x328] names DGROUP 0x328 as t, the 768 byte palette buffer."
state = "resolved"
resolution = "PARTLY, AND NOW MEASURED. BARS.INC compiled unmodified reproduces five routines exactly: RotPal2 at 015d, RotPal3 at 01ff, RotPal0 at 02a1, RotPal1 at 0449 and rotpal at 05f1 -- 1262 bytes with ZERO unexplained differing bytes. Every difference is a far pointer into the System segment or a DGROUP variable address, and both converge as the reconstruction completes. Corroborating details that could not be luck: RotPal2 frames 0x32 bytes of locals in both, which is Loop and loop2 as bytes plus Tmp as sixteen RGBt, so even the UNUSED loop2 is confirmed -- without it the frame would be 49. And rotpals relative call to RotPal0, e8 92 fc, is identical, so all four rotators are exactly the original sizes. So the include IS the original source, with edits: DeltaPal writes rep outsb where the binary does lodsb/out/loop, and Drawit declares F : File, never uses it, and has a conspicuous gap before its End where the scroll.col loading the binary performs has been removed. Treat BARS.INC as the original at a different revision: compile each routine and let the bytes decide, which is now cheap."

[[plan.investigation]]
name = "twin-routines-02a1-0449"
finding = "Two routines of 424 bytes each at 02a1 and 0449 have the same far-call profile: System:0776 sixteen times and System:09d3 eight times in each, plus the usual stack check. Same size and same shape is a strong hint they are a pair, either two effects built from one template or one routine duplicated. Neither is identified. If they are a duplicated body, that is a shared-source-versus-shared-unit question the wiki already covers under one-routine-two-units, and getting it wrong changes the emitted code at every call site."
state = "resolved"
resolution = "They are a forward/backward pair of palette cyclers, and the whole animation is now read. Both are 424 bytes and 92 percent byte-identical; the 34 differing bytes are all low bytes of mov di immediates holding DGROUP addresses. Each routine is eight unrolled 51-byte blocks, one per band, bands stepping 48 bytes which is 16 colours, based on t at DGROUP 0x328 which bin/BARS.INC names. 02a1 saves each bands LAST colour, shifts the other fifteen up one place, and puts the saved colour first. 0449 saves the FIRST colour, shifts down, and puts it last. Colours 1 to 128 are covered and colour 0 is never touched. A second pair does the same job at a coarser grain: 015d and 01ff move 336 bytes between t+3 and t+51, rotating the whole 128-colour region by a whole 16-colour band in each direction. 05f1 dispatches all four on a 640-frame cycle in four phases of 200, 120, 200, 120, counted in [0x320] and wrapped at 0x280. Two System routines were identified on the way: 11a6:0776 is a forward-only rep movsb copy and 11a6:09d3 is the overlap-safe Move that copies backward when the source is below the destination. The compiler chose the overlap-safe one exactly where the block shifts overlap by 42 bytes and the plain one for the 3-byte saves to a stack local, which corroborates the whole reading."

[[plan.investigation]]
name = "folded-subscript-at-0cb1"
finding = "The blitter at 0cb1 reads its source with mov al, es:[di - 0x2011], where di is a far pointer from DGROUP 0x628 plus [bp-2]*256 plus [bp-1]*16. The wiki observation subscript-fold-names-the-bounds says a constant folded into the displacement encodes the arrays lower bounds, so 0x2011 should name them and give the source images dimensions for free. It does not decompose against the two strides seen: 0x2011 is 32*256 + 17, and 17 is not a multiple of the 16-byte stride, so a third term is in play. Reading the rest of the index arithmetic in 0cb1 settles it, and the answer is the shape of whatever Check2.Cel or Asphyx.Cel holds."
state = "resolved"
resolution = "Solved, and it hands over the source images shape as the wiki observation said it would. 0x2011 is 32*256 + 1*16 + 1, so the array is array[32..N, 1..16, 1..16] of Byte -- character, row, column, all three of the strides now accounted for. It is the FONT: 1000:0ac9 pushes 0x3b00 to a System allocator at 11a6:023f and stores the returned far pointer at 0x628, and 0x3b00 is 15104, which is exactly the size of bin/GOLD.FNT on disk. 15104 over 256 is 59 glyphs of 16 by 16, and characters 32 to 90 inclusive is 59 -- space through Z, which is exactly the character set the all-caps scrolltext needs. Four numbers agree that were measured independently."

[[plan.investigation]]
name = "heap-pointer-at-0628"
finding = "DGROUP 0x628 holds a FAR POINTER, loaded with les di, ptr [0x628] nine times in the blitter at 0cb1. Nothing in segment 1000 writes image data to an absolute DGROUP address, which is explained by this: the picture lives on the heap and only the pointer is in DGROUP. Whoever allocates it and whichever loader fills it is unread. This is also the most likely resolution path for table-at-dgroup-0717, since a second heap structure would be reached the same way and would equally leave no absolute reference."
state = "resolved"
resolution = "It is the font buffer. 1000:0aba pushes 0x3b00 -- 15104 bytes, the size of bin/GOLD.FNT -- to a System routine at 11a6:023f that returns a far pointer in DX:AX, and stores it at 0x628 and 0x62a. The blitter at 0cb1 loads that pointer with les di and indexes it by character times 256 plus row times 16, which is why nothing in the segment references the picture by absolute address. Whether the source spells the allocation New or GetMem is not settled by the bytes and will be settled by building it: 023f takes a size and returns a pointer, which is not TP GetMem procedure signature."

[[plan.investigation]]
name = "modex-identical"
finding = "FIRST UNIT RECONSTRUCTED. MODEX at 112f is byte-identical over all 202 bytes with 13 pending fixups. Three corrections were needed and each was found by measurement rather than argument. One: SetPlane is FAR, not near -- 112f:0015 pushes CS before the near call, which is how Borland reaches a far routine in the same segment, and reading the e8 alone said near. Two: both PutPixel coordinates are Integer -- y was read as Word because the original multiplies with MUL rather than IMUL, which is unsound since the low 16 bits of a product are identical either way, and the Word/Integer mix promoted the address expression to LongInt and emitted an ADC the original has not got. Three: SetPlanes port writes are hand-written assembler -- Port[$3C4] then Port[$3C5] emits a fresh mov dx for each and the original walks the pair with inc dx. Progress was 10 percent, then 18, then 92, then identical."
state = "resolved"
resolution = "Identical at 202 of 202 bytes. Recorded as an investigation and resolved in one step because the finding IS the resolution; the three corrections inside it are the transferable part."

[[plan.investigation]]
name = "barsinc-names-the-palette-routines"
finding = "bin/BARS.INC contains Pascal for all five palette routines and every structural detail agrees with the reading derived from bytes beforehand. RotPal0 is 02a1, RotPal1 is 0449, RotPal2 is 015d, RotPal3 is 01ff, rotpal is the dispatcher at 05f1 with the identical case arms and wrap, StartPal is the builder at 064b. GlobCount is [0x320] and T is the palette at [0x328], an array[0..255] of RGBt indexed from 1, which is why the measured band addresses came out at t+3 and t+48. The include is therefore substantially the real source even though its DeltaPal does not match. NEXT: with the toolchain proven and MODEX identical, bring these routines into SILKY.PAS one at a time and let the byte comparison decide each. WaitRetrace at 1000:0000 and DeltaPal at 1000:002b are the first two routines in the program segment, so a prefix comparison starts paying immediately. This needs a blocks config and program_blocks in link.toml, because the program emits no TPU and blockcmp rather than units.py is what measures it."
state = "open"

[[plan.investigation]]
name = "swapped-playpal-startpal"
finding = "CORRECTION to the previous commit. It recorded 064b as StartPal. 064b is PlayPal and 095e is StartPal. PlayPal writes T[150+Loop+count] and 064b holds add ax,0x96 which is 150. StartPal opens gotoscnpos then FillChar(palcol,SizeOf(palcol),0), and 095e opens call 000e then FillChar(ds:0x2d4,5,0), which also names 000e as gotoscnpos and PalCol as five bytes at 0x2d4. StartPals body is repeat playpal, rotpal, deltapal, inc Count, if Count > 15, and 095e is call 064b, call 05f1, call 002b, inc [bp-6], cmp [bp-6],0x0f. The palcol[2] arm compares against 30 which is 0x1e and the palcol[3] arm against 40 which is 0x28 incrementing by 2, both of which 095e does exactly. The descriptions in docs/05 were already right; only the two names were transposed. Recorded rather than quietly edited because the wrong pair sat in a commit message where nothing re-derives it."
